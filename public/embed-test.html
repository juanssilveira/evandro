<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External WatchMap Embed Test</title>

  <!-- Hostile External CSS: Intentionally aggressive styles to test Shadow DOM isolation -->
  <style>
    /* 1. Breaking global box-sizing */
    * {
      box-sizing: content-box !important;
    }

    /* 2. Breaking button styling */
    button {
      all: unset !important;
      cursor: pointer !important;
      background: yellow !important;
      color: red !important;
      padding: 4px !important;
      border: 2px dashed red !important;
    }

    /* 3. Breaking video tag dimensions */
    video {
      width: 30px !important;
      height: 30px !important;
      opacity: 0.8 !important;
    }

    /* 4. Host page theme */
    body {
      background-color: #121214;
      color: #e1e1e6;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .test-card {
      background: #202024;
      border: 1px solid #323238;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .test-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }

    .test-controls input {
      padding: 8px 12px;
      background: #121214;
      border: 1px solid #323238;
      border-radius: 4px;
      color: white;
      font-family: monospace;
      font-size: 14px;
      width: 320px;
    }

    .test-controls button.page-btn {
      all: revert !important;
      background: #7C3AED !important;
      color: white !important;
      padding: 8px 16px !important;
      border-radius: 6px !important;
      border: none !important;
      font-weight: 500 !important;
      cursor: pointer !important;
    }

    .test-controls button.page-btn:hover {
      background: #6D28D9 !important;
    }

    .player-wrapper {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
  </style>

  <!-- WatchMap Standalone Embed Script -->
  <script src="/embed/v1/watchmap-player.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>External WatchMap Embed Test</h1>
    <p style="font-size: 14px; color: #a8a8b3;">
      Esta página externa valida o funcionamento do <code>&lt;watchmap-player&gt;</code> isolado por Shadow DOM.
      Ela possui regras CSS globais intencionalmente destrutivas (ex: <code>* { box-sizing: content-box }</code>, <code>video { width: 30px }</code>, <code>button { all: unset }</code>).
    </p>

    <div class="test-card">
      <div class="test-controls">
        <label for="video-id-input" style="font-size: 13px;">Public Video ID:</label>
        <input type="text" id="video-id-input" placeholder="Cole o public_id aqui" value="" />
        <button type="button" class="page-btn" id="load-btn">Carregar Vídeo</button>
        <button type="button" class="page-btn" id="toggle-btn" style="background: #374151 !important;">Desmontar / Montar</button>
      </div>

      <div id="player-mount-area" class="player-wrapper">
        <watchmap-player id="embed-instance" video-id=""></watchmap-player>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("video-id-input");
    const loadBtn = document.getElementById("load-btn");
    const toggleBtn = document.getElementById("toggle-btn");
    const mountArea = document.getElementById("player-mount-area");

    let currentVideoId = "";

    // If videoId is provided via search param ?v=...
    const urlParams = new URLSearchParams(window.location.search);
    const paramVideoId = urlParams.get("v") || urlParams.get("videoId");
    if (paramVideoId) {
      input.value = paramVideoId;
      currentVideoId = paramVideoId;
      const player = document.getElementById("embed-instance");
      if (player) {
        player.setAttribute("video-id", paramVideoId);
      }
    }

    loadBtn.addEventListener("click", () => {
      const val = input.value.trim();
      currentVideoId = val;
      const player = document.getElementById("embed-instance");
      if (player) {
        player.setAttribute("video-id", val);
      } else {
        const newPlayer = document.createElement("watchmap-player");
        newPlayer.id = "embed-instance";
        newPlayer.setAttribute("video-id", val);
        mountArea.appendChild(newPlayer);
      }
    });

    toggleBtn.addEventListener("click", () => {
      const existing = document.getElementById("embed-instance");
      if (existing) {
        existing.remove();
        toggleBtn.textContent = "Remontar Player";
      } else {
        const newPlayer = document.createElement("watchmap-player");
        newPlayer.id = "embed-instance";
        newPlayer.setAttribute("video-id", currentVideoId);
        mountArea.appendChild(newPlayer);
        toggleBtn.textContent = "Desmontar Player";
      }
    });
  </script>
</body>
</html>
